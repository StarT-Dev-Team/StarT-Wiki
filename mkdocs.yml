site_name: Star Technology Wiki
site_url: https://start-dev-team.github.io/StarT-Wiki/
site_description: "Official documentation for the Minecraft modpack Star Technology"
repo_name: Star Technology
repo_url: https://github.com/StarT-Dev-Team/Star-Technology
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  logo: assets/logo.png
  favicon: assets/flavicon.ico
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy 
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch

  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: deep purple
      accent: light blue

    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: deep purple
      accent: amber

markdown_extensions:
  - toc:
      permalink: ¶
  - attr_list
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
          config:
            theme: 'base'
            flowchart: 
              nodeSpacing: 10
              rankSpacing: 20
              curve: basis
              useMaxWidth: false
            themeVariables:
              primaryColor: '#fff'
              primaryTextColor: '#fff'
              primaryBorderColor: '#7e56c2'
              lineColor: '#F8B195'
              fontSize: '16px'
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search
  - mermaid2
  - panzoom:
      full_screen: true



extra_css:
    - assets/styles/styles.css
    - assets/styles/extra.css

extra_javascript:
    - https://unpkg.com/mermaid/dist/mermaid.min.js


